name: Build unsigned Yuedu-reader IPA
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'

      - name: 修改 BundleID、App名称、最低iOS版本
        run: |
          # 修改 ios 项目配置
          sed -i '' 's/com.example.runner/com.yuedu.reader/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/Runner/悦读阅读器/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = .*/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/g' ios/Runner.xcodeproj/project.pbxproj
          sed -i '' 's/<string>Runner<\/string>/<string>悦读阅读器<\/string>/g' ios/Runner/Info.plist

      - name: Install pods
        run: |
          cd ios
          pod install
          cd ..

      - name: Build unsigned release IPA
        run: flutter build ios --release --no-codesign

      - name: 打包Payload生成ipa
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Yuedu-reader-unsigned.ipa Payload

      - name: 上传成品裸IPA
        uses: actions/upload-artifact@v4
        with:
          name: Yuedu-reader-unsigned-ipa
          path: Yuedu-reader-unsigned.ipa
