name: Build unsigned Yuedu-reader IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build
        run: |
          xcodebuild -scheme Yuedu-Reader -configuration Release -derivedDataPath build archive

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueduReader-unsigned
          path: build/Build/Products/Release-iphoneos/*.ipa
