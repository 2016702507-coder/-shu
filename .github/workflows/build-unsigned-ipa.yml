name: Build Unsigned IPA

on:
  workflow_dispatch:   # 允许在 GitHub 页面上手动点击按钮触发构建

jobs:
  build:
    runs-on: macos-latest   # 使用 GitHub 免费提供的 macOS 运行器
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Archive (Unsigned)
        run: |
          xcodebuild clean archive \
            -project YourProject.xcodeproj \
            -scheme YourScheme \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Export Unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/YourApp.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload YourApp-unsigned.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: YourApp-unsigned.ipa
