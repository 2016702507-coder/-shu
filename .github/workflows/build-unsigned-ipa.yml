name: Build unsigned Yuedu-reader IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build only main app
        run: |
          xcodebuild -scheme Yuedu-Reader -target "yuedu app" -configuration Release build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Find .app and package IPA
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "yuedu_app*.app" | grep Release-iphoneos | head -1)
          echo "Found app: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r Yuedu-Reader.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueduReader-unsigned
          path: Yuedu-Reader.ipa
