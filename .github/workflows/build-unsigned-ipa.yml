name: Build unsigned Yuedu-reader IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build only main app target
        run: |
          xcodebuild -scheme Yuedu-Reader -target "yuedu app" -configuration Release -derivedDataPath build build CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA manually
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r Yuedu-Reader.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: YueduReader-unsigned
          path: Yuedu-Reader.ipa
